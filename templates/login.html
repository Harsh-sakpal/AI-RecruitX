<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Login - AI RecruitX</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <!-- Subtle corporate blue background highlights -->
        <div style="position: absolute; width: 400px; height: 400px; background: rgba(37, 99, 235, 0.03); filter: blur(100px); top: -10%; left: -10%; border-radius: 50%;"></div>
        <div style="position: absolute; width: 500px; height: 500px; background: rgba(37, 99, 235, 0.04); filter: blur(120px); bottom: -10%; right: -10%; border-radius: 50%;"></div>

        <div class="login-glass-card text-center">
            <div class="mb-4">
                <i class="fa-solid fa-briefcase brand-text fa-2x mb-2"></i>
                <h2 class="brand-text">AI RecruitX</h2>
                <p class="text-secondary small">Resume Screening & Ranking Portal</p>
            </div>

            {% if error %}
            <div class="alert alert-danger py-2 small" role="alert">
                <i class="fa-solid fa-circle-exclamation me-2"></i>{{ error }}
            </div>
            {% endif %}

            <form action="/login" method="POST">
                <div class="mb-3 text-start">
                    <label for="username" class="form-label text-secondary small fw-medium">Recruiter Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-secondary" style="border: 1px solid #cbd5e1; border-right: none;">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" class="form-control form-custom-control" id="username" name="username" placeholder="e.g. admin" required style="border-left: none; font-size: 0.9rem;">
                    </div>
                </div>

                <div class="mb-4 text-start">
                    <label for="password" class="form-label text-secondary small fw-medium">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-secondary" style="border: 1px solid #cbd5e1; border-right: none;">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" class="form-control form-custom-control" id="password" name="password" placeholder="••••••••" required style="border-left: none; font-size: 0.9rem;">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 text-white fw-bold py-2 shadow-sm" style="background-color: var(--color-primary); border: none;">
                    Access Recruiter Dashboard
                </button>
            </form>

            <p class="text-secondary mt-4 mb-0" style="font-size: 0.76rem; border-top: 1px solid #e2e8f0; padding-top: 14px;">
                Project by &nbsp;<strong style="color:#374151;">Harsh Sakpal</strong> &nbsp;·&nbsp;
                <strong style="color:#374151;">Harshada Pawar</strong> &nbsp;·&nbsp;
                <strong style="color:#374151;">Sakshi Raul</strong>
            </p>

        </div>
    </div>
</body>
</html>
